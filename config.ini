; Xbox Controller Button Remapper configuration file

; This app can disable the OS controller shortcut automatically (see XboxMultiClick setting below).
; Remapping the Share button only works when the "Windows Game Recording and Broadcasting" features are disabled
; See the ReadMe for details

[settings]
; Debug shows Xbox/Share button DOWN/UP, multi-click counts/actions, and device status.
; Analog sticks, triggers, joystick axes and unhandled SDL events are NOT logged.
; Enable debug mode to show these messages in a console window
; Enable: 1
; Disable: 0 (default)
debug = 1

; Input scan period in milliseconds. Short virtual Xbox taps may be missed
; if the interval is too long. Valid range: 1-50, default 2.
poll_interval_ms = 2

; Open file by setting key
; Default: C:\Windows\explorer.exe
file_location = C:\Windows\explorer.exe

; Open file using key on keyboard
; Default: 0 (Disabled)
file_key = 0

[screen_capture]
; Take screenshot by setting key

; Captures location
; Default: C:\Screenshots
location = C:\Screenshots

; Take screenshot using key on keyboard
; Default: 0 (Disabled)
screenshot_key = 0

; Whether to show a colored border around the display to indicate that a capture is in progress
; Enable: 1 (default)
; Disable: 0
border = 1

; Enable to capture the cursor
; Enable: 1
; Disable: 0 (default)
cursor = 0

[XboxMultiClick]
; Set the per-user Windows Game Bar GUIDE-button shortcut to OFF at startup.
; Does not disable keyboard Win+G. Requires Windows sign-out/restart on some builds.
; Set to 0 before using the bundled restore script.
disable_system_gamebar_button = 1

; Enable Xbox button multi-click recognition for all connected controllers.
; 1 = enabled (default), 0 = use original xbox_key / xbox_hold_mode behavior.
enabled = 1

; Use joystick for this third-party controller: SDL raw button DOWN.
; The log identifies the actual repeated Xbox taps as raw button 10 DOWN.
; Set joystick_button to the raw button number shown in debug logs.
; Only one source is counted, so raw and mapped events cannot double-count.
input_source = joystick
joystick_button = 10

; Each configured input source DOWN event counts as one click immediately.
; Button release (UP) is NOT used at all in multi-click mode.
; Maximum interval between two DOWN events (50-5000 ms).
; Single/double actions are delayed until the last DOWN's window expires.
; Three DOWN events in the window trigger triple-click immediately.
; For this controller, use 500ms to allow human double/triple taps.
multi_click_interval_ms = 500

; Optional de-duplication for controllers that send multiple DOWN events
; for one button command. 0=disabled (default, counts every DOWN event).
; Increase to ~20-50 only if debug logs show duplicate DOWN events.
; Valid range: 0-250 ms. Avoid a value that hides deliberate fast taps.
down_debounce_ms = 0

; Old short_press_max_ms setting is obsolete and ignored in this mode.
; Long-press detection is not available while press-only multi-click is on:
; it requires distinguishing a held button from a tap without reliable UP.
; Disable multi-click (enabled=0) to use the original Xbox long-press mapping.

; Each click can be assigned its own action:
; screenshot = native capture to [screen_capture] location
; gamebar    = Win+G
; win_tab    = Win+Tab (Windows Task View)
; alt_tab    = Alt+Tab (optional legacy action)
; open_file  = open [settings] file_location
; toggle_mic = toggle the default input microphone mute state
; keys      = send a custom keyboard key / simultaneous key combination
; none      = do nothing
;
; If action = keys, put 1-8 decimal Windows virtual key codes in the matching
; *_click_keys setting, in order (modifiers first, e.g. 17,16,27 = Ctrl+Shift+Esc).
; The key list is ignored for all actions other than keys.
; Invalid/empty key combinations and unknown actions are safely disabled.
; Config is read at program startup: exit the tray app and restart after edits.
;
; Examples:
; - double_click_action = keys  and  double_click_keys = 91,71  (Win+G)
; - triple_click_action = keys  and  triple_click_keys = 91,9  (Win+Tab)
; - single_click_action = keys  and  single_click_keys = 179  (Play/Pause)
;
single_click_action = screenshot
single_click_keys = 0

double_click_action = gamebar
double_click_keys = 0

triple_click_action = win_tab
triple_click_keys = 0

[controller1]
; Map the Share button on the controller

; Decimal key code, see the bottom of this file for a list
; Multiple keys are supported. Separate multiple keys with commas.
; If you set it to 0, set longpress_key correctly, and set hold_mode = 2,
; tapping the button for less than longpress_duration will do nothing.
; Default: 0 (Disabled, no remapping is done)
share_key = 0

; If 1, "key" will be sent for as long as button is pressed and longpress_*
; will be ignored - simple as that.
; If 2, "key" will be briefly tapped if button is held for less than
; longpress_duration, and longpress_key will be briefly tapped if the button
; is held for longer than that.
; Note that even after the button has been held for longer than longpress_duration,
; you still need to release it before anything will be sent.
; Default: 2
share_hold_mode = 2

; See above.
; Multiple keys are supported. Separate multiple keys with commas.
; Default: 0 (Disabled, no remapping is done)
share_longpress_key = 0

; See above. In milliseconds (1000 = 1 second)
; Default: 1000
share_longpress_duration = 1000

; Wait this long before tapping a key (whether longpress or not).
; In milliseconds
; Ignored if hold_mode = 1
; In hold_mode = 2, wait this many ms after the button is released before sending
; the keypress (whether key or longpress_key).
; Don't make it too long as other presses will not be detected during this wait.
; Default: 0
share_delay = 0

; Wait this long before releasing a key (whether longpress or not).
; In milliseconds
; Ignored if hold_mode = 1
; In hold_mode = 2, wait this many ms before releasing the key (whether key or longpress_key).
; Don't make it too long as other presses will not be detected during this wait.
; Default: 1
share_duration = 1

; Map the Xbox button on the controller

; See above.

; Default: 0 (Disabled, no remapping is done)
xbox_key = 0

; Default: 2
xbox_hold_mode = 2

; Default: 0 (Disabled, no remapping is done)
xbox_longpress_key = 0

xbox_longpress_duration = 1000
xbox_delay = 0
xbox_duration = 1

; End of controller1.
; Settings for other controllers follow

[controller2]
share_key = 0
share_hold_mode = 2
share_longpress_key = 0
share_longpress_duration = 1000
share_delay = 0
share_duration = 1
xbox_key = 0
xbox_hold_mode = 2
xbox_longpress_key = 0
xbox_longpress_duration = 1000
xbox_delay = 0
xbox_duration = 1

[controller3]
share_key = 0
share_hold_mode = 2
share_longpress_key = 0
share_longpress_duration = 1000
share_delay = 0
share_duration = 1
xbox_key = 0
xbox_hold_mode = 2
xbox_longpress_key = 0
xbox_longpress_duration = 1000
xbox_delay = 0
xbox_duration = 1

[controller4]
share_key = 0
share_hold_mode = 2
share_longpress_key = 0
share_longpress_duration = 1000
share_delay = 0
share_duration = 1
xbox_key = 0
xbox_hold_mode = 2
xbox_longpress_key = 0
xbox_longpress_duration = 1000
xbox_delay = 0
xbox_duration = 1

